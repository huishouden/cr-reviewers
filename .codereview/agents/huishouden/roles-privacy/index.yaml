name: roles-privacy
description: Checks that Huishouden changes keep each household's data visible only as roles allow — admin, member, helper, kid; money and health never to helpers or kids; private flags, personal audiences, contact pay details, signed records — enforced by the rules, not just hidden in the UI, and never sent to analytics.
model_tier: large
effort: high
file_globs:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.rules"
  - "**/firestore.indexes.json"
applies_when:
  - The repository is in the huishouden GitHub org or depends on @huishouden/pwa-kit (an app, the kit, huishouden/rules, or a Worker such as connector, calendar or notify), and the change reads or writes household data, adds a collection or field, changes Firestore rules, role checks, private flags, agenda/to-do/reminder publishing, sharing, or observability.
needs_full_file_content: true
