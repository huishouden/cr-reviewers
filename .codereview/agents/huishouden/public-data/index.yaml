name: public-data
description: Guards the public Huishouden repos against real or inferable personal data that secret scanners miss — real people, transactions, medicines, places, providers, card or account details, habits — in fixtures, sample data, test seeds, comments, docs, copy and screenshots.
model_tier: large
effort: high
file_globs:
  - "**/*"
applies_when:
  - The repository is in the huishouden GitHub org or depends on @huishouden/pwa-kit (every such repo is public) and the change adds or edits data, fixtures, sample/demo data, test seeds, comments, documentation, configuration, UI copy, or images.
needs_full_file_content: true
