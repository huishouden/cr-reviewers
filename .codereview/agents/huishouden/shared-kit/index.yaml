name: shared-kit
description: Keeps Huishouden apps and Workers from re-implementing what @huishouden/pwa-kit provides or should provide — flags copies of kit functionality, hand-rolled data access that bypasses the kit, and code two apps now share that belongs in the kit.
model_tier: medium
effort: medium
file_globs:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.css"
  - "**/*.yml"
  - "**/*.json"
  - "**/*.sh"
applies_when:
  - The repository is a Huishouden app or Worker (in the huishouden GitHub org or depends on @huishouden/pwa-kit), not the kit itself, and the change adds code, config, scripts or workflows.
needs_full_file_content: true
