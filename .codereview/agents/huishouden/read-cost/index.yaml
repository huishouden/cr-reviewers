name: read-cost
description: Catches Firestore read-cost bugs in Huishouden before they reach the free plan's shared 50,000 reads a day — unbounded loops and retries over reads, state machines that go back a step without progress, comparisons against counts or snapshots taken earlier in the same job, listeners re-subscribed on every render, reads outside a Worker's ReadBudget, and read paths without a read-budget test.
model_tier: large
effort: high
file_globs:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/wrangler.toml"
applies_when:
  - "The repository is in the huishouden GitHub org or depends on @huishouden/pwa-kit, and the change touches code that reads Firestore or schedules work that does. That includes, whatever else the diff is about (D1 tables, queues, CPU units, refactors, state machines): any src/ change in a Worker (huishouden/calendar, notify, connector — their jobs read Firestore through Person, FirestoreRest, a Firestore class or a ReadBudget even when the diff mostly shows D1); the kit's sync, watch, household, published, firestore-rest, read-budget or read-test modules; an app's data hooks, stores, effects or screens that subscribe or query; a read budget, a FIRESTORE_*_READS value or a read-budget test."
needs_full_file_content: true
